name: Update cloud IPs

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 10:00 UTC
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  update-cloud-ips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install necessary packages
        run: pip install -r requirements.txt

      # Each provider only replaces its own output on success: failed providers
      # keep their previous data and successful ones are still committed.
      - name: Generate new cloud ips
        id: generate
        continue-on-error: true
        run: |
          python main.py

      - name: Update README with providers table
        run: |
          bash .github/scripts/update_readme.sh

      - name: Check for changes
        id: check_changes
        run: |
          git add -N cloud_ips
          git diff --quiet cloud_ips README.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push results
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add cloud_ips/ README.md
          git commit -m "Update cloud IPs - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Fail if a provider failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::At least one provider failed, see the 'Generate new cloud ips' step"
          exit 1
